services:
  - type: web
    name: forum-bonito
    runtime: node
    plan: starter
    disk:
      name: forum-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CREATOR_PASSWORD
        sync: false
      - key: DB_FILE_PATH
        value: /var/data/forum.sqlite